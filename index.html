<!doctype html>

<head>

  <title>Condos_Id</title>
  <style>
    :root { color-scheme: dark; --bg:#0e1015; --panel:#171a22; --text:#f4f5f7; --muted:#9ca3af; --accent:#7c5cff; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); }
    header { padding:28px 18px 20px; background:linear-gradient(135deg,#191b27,#11131a); border-bottom:1px solid #292d38; }
    .wrap { width: 100%; max-width: none; margin: 0; }
    .brand { font-size:clamp(24px,4vw,36px); font-weight:850; letter-spacing:-.8px; }
    .subtitle { margin-top:7px; color:var(--muted); font-size:14px; }
    main { padding: 0; }
    .section-title { font-size:18px; font-weight:750; margin:0 0 16px; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 20px; width: 100%; }
    .card { display:block; color:inherit; text-decoration:none; background:var(--panel); border:1px solid #292d38; border-radius:13px; overflow:hidden; transition:transform .16s,border-color .16s; }
    .card:hover,.card:focus-visible { transform:translateY(-3px); border-color:var(--accent); outline:none; }
    .thumb { width: 100%; aspect-ratio: 16 / 9; position: relative; overflow: hidden; background: #242838; }
    .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .placeholder { width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#34315c,#202c45); font-size:36px; font-weight:900; }
    .info { padding:12px 13px 14px; }
    .title { font-size:15px; font-weight:750; line-height:1.3; }
    .tag { color:var(--muted); font-size:12px; margin-top:6px; }
    footer { text-align:center; padding:18px; color:var(--muted); font-size:12px; border-top:1px solid #242833; }
    @media(max-width:850px) { .grid { grid-template-columns:1fr; gap:12px; } }
    @media(max-width:580px) { header { padding-top:22px; } .grid { grid-template-columns:1fr; gap:10px; } .info { padding:10px; } .title { font-size:14px; } }
  </style>
</head>
